# =================================================================
# ⚙️ WORKFLOW CI/CD GITHUB ACTIONS (INTEGRATION & DEPLOYMENT CONTINU)
# =================================================================
name: CI/CD Pipeline

# Déclencheurs du pipeline
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # -------------------------------------------------------------
  # JOB 1 : TESTS & VALIDATION (INTEGRATION CONTINUE)
  # -------------------------------------------------------------
  test:
    name: Validation & Tests
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v3

      - name: 🟢 Configurer l'environnement Node.js
        uses: actions/setup-node@v3
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: 📦 Installer les dépendances du Backend
        working-directory: ./backend
        run: npm ci

      - name: 🛠️ Générer le Client Prisma
        working-directory: ./backend
        run: npm run prisma:generate
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/todoapp?schema=public"

      - name: 🧪 Exécuter les tests unitaires
        working-directory: ./backend
        run: npm run test
        env:
          DATABASE_URL: "postgresql://postgres:postgres@localhost:5432/todoapp?schema=public"
          JWT_SECRET: "test_secret_key_for_github_actions"

  # -------------------------------------------------------------
  # JOB 2 : COMPILATION & PUBLICATION (DÉPLOIEMENT CONTINU)
  # -------------------------------------------------------------
  build-and-push:
    name: Build & Push Docker Images
    runs-on: ubuntu-latest
    needs: test
    # Ne se déclenche que sur push vers la branche main (validation finale)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: 📥 Récupérer le code source
        uses: actions/checkout@v3

      - name: 🐳 Configurer Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: 🔐 Connexion au registre Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # --- BUILD & PUSH DU BACKEND ---
      - name: 🚀 Build & Push Image Backend
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          file: ./backend/Dockerfile
          push: true
          # Double tagging : par hash de commit (traçabilité) et latest
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-backend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # --- BUILD & PUSH DU FRONTEND ---
      - name: 🚀 Build & Push Image Frontend
        uses: docker/build-push-action@v4
        with:
          context: ./frontend-web
          file: ./frontend-web/Dockerfile
          push: true
          # Injection de l'URL de production de l'API lors du build (ex: l'IP du VPS ou nom de domaine)
          build-args: |
            VITE_API_URL=http://localhost:5000/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/todo-frontend:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
